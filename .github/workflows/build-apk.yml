name: Build PXL Studio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'paint.css'
      - 'paint.js'
      - 'PXL-Studio-Android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Copy latest PXL Studio files into Android app
        shell: bash
        run: |
          test -d PXL-Studio-Android/www || { echo "Missing PXL-Studio-Android/www. Add the Android setup folder to the repository first."; exit 1; }
          cp index.html paint.css paint.js PXL-Studio-Android/www/

      - name: Install Capacitor dependencies
        working-directory: PXL-Studio-Android
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: PXL-Studio-Android
        run: npx cap add android

      - name: Sync web app to Android
        working-directory: PXL-Studio-Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: PXL-Studio-Android/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PXL-Studio-APK
          path: PXL-Studio-Android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
